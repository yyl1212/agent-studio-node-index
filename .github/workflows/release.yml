name: Release

'on':
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: agent-studio-node-index-release
  cancel-in-progress: false

jobs:
  build:
    name: Build verified release assets
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go 1.26.5
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.5'
          cache: false

      - name: Validate release history
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if ! jq -e '.created == true and .deleted == false and .forced == false' "$GITHUB_EVENT_PATH" >/dev/null; then
            echo "release tags must be newly created and must never be reused" >&2
            exit 1
          fi
          if [[ "$(git cat-file -t "$GITHUB_REF_NAME")" != "tag" ]]; then
            echo "release ref must be an annotated Tag" >&2
            exit 1
          fi

          head_commit=$(git rev-parse HEAD)
          tag_commit=$(git rev-parse "${GITHUB_REF_NAME}^{commit}")
          if [[ "$head_commit" != "$tag_commit" ]]; then
            echo "checkout HEAD does not match the release Tag commit" >&2
            exit 1
          fi

          release_probe=$(mktemp "$RUNNER_TEMP/release-probe.XXXXXX")
          release_tags=$(mktemp "$RUNNER_TEMP/release-tags.XXXXXX")
          semver_checker=$(mktemp "$RUNNER_TEMP/release-semver.XXXXXX.go")
          trap 'rm -f "$release_probe" "$release_tags" "$semver_checker"' EXIT

          if gh api --include \
            "repos/$GITHUB_REPOSITORY/releases/tags/$GITHUB_REF_NAME" \
            -H "X-GitHub-Api-Version: 2026-03-10" >"$release_probe" 2>&1; then
            echo "a Release already exists for $GITHUB_REF_NAME" >&2
            exit 1
          elif ! grep -Eq 'HTTP/[0-9.]+ 404|HTTP 404' "$release_probe"; then
            cat "$release_probe" >&2
            echo "unable to prove that the Release does not exist" >&2
            exit 1
          fi

          gh api --paginate \
            "repos/$GITHUB_REPOSITORY/releases?per_page=100" \
            -H "X-GitHub-Api-Version: 2026-03-10" \
            --jq '.[] | select(.draft == false and .prerelease == false) | .tag_name' \
            >"$release_tags"

          cat >"$semver_checker" <<'GO'
          package main

          import (
            "bufio"
            "fmt"
            "os"
            "strings"

            "golang.org/x/mod/semver"
          )

          func stableFull(version string) bool {
            return semver.IsValid(version) && semver.Canonical(version) == version && semver.Prerelease(version) == "" && semver.Build(version) == ""
          }

          func main() {
            current := os.Args[1]
            if !stableFull(current) {
              fmt.Fprintf(os.Stderr, "%s is not stable full SemVer\n", current)
              os.Exit(1)
            }
            previous := ""
            scanner := bufio.NewScanner(os.Stdin)
            for scanner.Scan() {
              candidate := strings.TrimSpace(scanner.Text())
              if !stableFull(candidate) {
                continue
              }
              if previous == "" || semver.Compare(candidate, previous) > 0 {
                previous = candidate
              }
            }
            if err := scanner.Err(); err != nil {
              fmt.Fprintln(os.Stderr, err)
              os.Exit(1)
            }
            if previous != "" && semver.Compare(previous, current) >= 0 {
              fmt.Fprintf(os.Stderr, "current release %s must be greater than previous release %s\n", current, previous)
              os.Exit(1)
            }
            fmt.Print(previous)
          }
          GO

          previous_tag=$(CGO_ENABLED=0 go run "$semver_checker" "$GITHUB_REF_NAME" <"$release_tags")
          if [[ -n "$previous_tag" ]]; then
            previous_commit=$(git rev-parse "${previous_tag}^{commit}")
            if ! git merge-base --is-ancestor "$previous_commit" "$tag_commit"; then
              echo "previous complete Release Tag is not an ancestor of the current Tag" >&2
              exit 1
            fi
          fi

      - name: Test and generate exact assets
        shell: bash
        run: |
          set -euo pipefail

          assert_exact_assets() {
            local directory=$1
            local expected actual name
            expected=$(printf '%s\n' checksums.txt index.json node-index-v1alpha1.schema.json)
            actual=$(find "$directory" -mindepth 1 -maxdepth 1 -exec basename {} \; | LC_ALL=C sort)
            if [[ "$actual" != "$expected" ]]; then
              echo "unexpected Release asset set in $directory" >&2
              printf 'expected:\n%s\nactual:\n%s\n' "$expected" "$actual" >&2
              return 1
            fi
            for name in checksums.txt index.json node-index-v1alpha1.schema.json; do
              if [[ ! -f "$directory/$name" || -L "$directory/$name" || ! -s "$directory/$name" ]]; then
                echo "Release asset must be a non-empty regular file: $name" >&2
                return 1
              fi
            done
          }

          CGO_ENABLED=0 go test ./... -count=1
          CGO_ENABLED=0 go vet ./...
          CGO_ENABLED=0 go run ./cmd/indexgen \
            -root . \
            -release "$GITHUB_REF_NAME" \
            -source-commit "$(git rev-parse HEAD)" \
            -generated-at "$(git show -s --format=%cI HEAD)" \
            -out dist

          assert_exact_assets dist
          (cd dist && sha256sum --check checksums.txt)

          release=$(jq -er '.metadata.release' dist/index.json)
          source_commit=$(jq -er '.metadata.sourceCommit' dist/index.json)
          tag_commit=$(git rev-parse "${GITHUB_REF_NAME}^{commit}")
          if [[ "$release" != "$GITHUB_REF_NAME" ]]; then
            echo "index release does not match the current Tag" >&2
            exit 1
          fi
          if [[ "$source_commit" != "$tag_commit" ]]; then
            echo "index source commit does not match the current Tag commit" >&2
            exit 1
          fi

      - name: Upload verified release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-assets
          path: |
            dist/checksums.txt
            dist/index.json
            dist/node-index-v1alpha1.schema.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
          include-hidden-files: false

  publish:
    name: Publish immutable stable release
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go 1.26.5
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: '1.26.5'
          cache: false

      - name: Download verified release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: release-assets
          path: dist

      - name: Regenerate expected release assets
        shell: bash
        run: |
          set -euo pipefail

          assert_exact_assets() {
            local directory=$1
            local expected actual name
            expected=$(printf '%s\n' checksums.txt index.json node-index-v1alpha1.schema.json)
            actual=$(find "$directory" -mindepth 1 -maxdepth 1 -exec basename {} \; | LC_ALL=C sort)
            if [[ "$actual" != "$expected" ]]; then
              echo "unexpected Release asset set in $directory" >&2
              return 1
            fi
            for name in checksums.txt index.json node-index-v1alpha1.schema.json; do
              if [[ ! -f "$directory/$name" || -L "$directory/$name" || ! -s "$directory/$name" ]]; then
                echo "Release asset must be a non-empty regular file: $name" >&2
                return 1
              fi
            done
          }

          assert_exact_assets dist
          (cd dist && sha256sum --check checksums.txt)

          head_commit=$(git rev-parse HEAD)
          tag_commit=$(git rev-parse "${GITHUB_REF_NAME}^{commit}")
          if [[ "$head_commit" != "$tag_commit" ]]; then
            echo "publish checkout HEAD does not match the current Tag commit" >&2
            exit 1
          fi
          release=$(jq -er '.metadata.release' dist/index.json)
          source_commit=$(jq -er '.metadata.sourceCommit' dist/index.json)
          if [[ "$release" != "$GITHUB_REF_NAME" ]]; then
            echo "downloaded index release does not match the current Tag" >&2
            exit 1
          fi
          if [[ "$source_commit" != "$tag_commit" ]]; then
            echo "downloaded index source commit does not match the current Tag commit" >&2
            exit 1
          fi

          CGO_ENABLED=0 go run ./cmd/indexgen \
            -root . \
            -release "$GITHUB_REF_NAME" \
            -source-commit "$tag_commit" \
            -generated-at "$(git show -s --format=%cI HEAD)" \
            -out expected
          assert_exact_assets expected
          for name in checksums.txt index.json node-index-v1alpha1.schema.json; do
            cmp --silent "dist/$name" "expected/$name"
          done

      - name: Publish verified immutable release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_DIST_DIR: dist
          RELEASE_EXPECTED_DIR: expected
        run: |
          bash scripts/release-publish.sh
